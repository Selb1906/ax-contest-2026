# 합성 LP 생성기 v0 설정
# 스카우팅 방문 이후 프로파일러 결과로 재보정 → configs/synth_v1.yaml 등으로 분기 예정
schema_version: 1

generator:
  seed: 42
  # v0 기본값은 로컬 확인용 소규모. 과제 스펙 3,500호는 아래 주석 참고
  n_customers: 100
  residential_ratio: 0.1428   # 500/3500 ≈ 0.1428, 100 중 14호 주택용
  start_date: "2022-01-01"
  end_date: "2022-06-30"      # v0: 6개월 — 3.5M 행 규모
  interval_min: 15
  output:
    path: "data/synth/lp_v0.parquet"
    partition_by: ["customer_id"]
  # 과제 스펙 풀규모 참고값 (사용 시 주석 해제 + 메모리·디스크 점검 필수)
  # n_customers: 3500
  # end_date: "2024-12-31"

residential:                  # 주택용 500호
  base_kwh_per_15min:
    dist: lognormal
    mu: -2.6                  # exp(-2.6) ≈ 0.074 kWh/15min → 약 7 kWh/day 평균
    sigma: 0.4
  daily_peaks:
    - { hour: 8,  multiplier: 1.4 }   # 아침 피크
    - { hour: 20, multiplier: 1.8 }   # 저녁 피크
  night_trough:
    hour: 3
    multiplier: 0.5
  weekend_multiplier: 1.1     # 주말 약간 증가
  holiday_multiplier: 1.1
  weather:
    cdd_base: 24.0
    cdd_coef: 0.045           # °C 초과 1도당 +4.5%
    hdd_base: 15.0
    hdd_coef: 0.025           # °C 미만 1도당 +2.5% (전기난방 가정 일부)
  noise_sigma: 0.15

general:                      # 일반용 3,000호 (상업 중심)
  base_kwh_per_15min:
    dist: lognormal
    mu: -0.5                  # exp(-0.5) ≈ 0.6 kWh/15min → 약 58 kWh/day 평균
    sigma: 0.8
  daily_peaks:
    - { hour: 14, multiplier: 2.0 }   # 업무시간 피크
  night_trough:
    hour: 2
    multiplier: 0.2
  weekend_multiplier: 0.5     # 주말 대폭 감소
  holiday_multiplier: 0.5
  weather:
    cdd_base: 24.0
    cdd_coef: 0.060           # AC 의존 큼
    hdd_base: 12.0
    hdd_coef: 0.012
  noise_sigma: 0.25

power_factor:
  mean: 0.92
  std: 0.03
  min: 0.7

max_demand:
  multiplier_min: 1.1
  multiplier_max: 1.5

weather:
  source: synthetic           # v0: 합성 온도. 이후 KMA ASOS 로 교체 예정
  mean_annual: 12.5
  amplitude_annual: 25.0      # 여름 25, 겨울 0 근사
  daily_amplitude: 8.0
  noise_sigma: 2.0

calendar:
  holidays_path: null         # "external_data/holidays_kr.csv" — 수집 후 활성
